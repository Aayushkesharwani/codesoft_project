<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web Design Course</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="main">
    <!-- NAVBAR -->
    <nav class="navbar">
      <h2 class="logo">Aayush / Yaman</h2>

      <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Contact</a></li>
      </ul>

      <div class="search">
        <input
          type="search"
          placeholder="Search..."
        />
        <button>Search</button>
      </div>
    </nav>

    <!-- CONTENT -->
    <div class="content">
      <div class="text">
        <h1>
          Web Design & <br />
          <span>Development</span>
        </h1>

        <p>
          Learn modern web design and development
          with practical examples and real projects.
        </p>

        <button class="primary-btn">
          Join Us
        </button>
      </div>

      <!-- LOGIN FORM -->
      <div class="form">
        <h2>Login</h2>

        <input
          type="email"
          placeholder="Email"
        />

        <input
          type="password"
          placeholder="Password"
        />

        <button class="login-btn">
          Login
        </button>

        <p class="signup">
          Don’t have an account?
          <a href="#">Sign up</a>
        </p>

        <p class="social-text">
          Login with
        </p>

        <div class="icons">
          <ion-icon name="logo-facebook"></ion-icon>
          <ion-icon name="logo-instagram"></ion-icon>
          <ion-icon name="logo-twitter"></ion-icon>
          <ion-icon name="logo-google"></ion-icon>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
